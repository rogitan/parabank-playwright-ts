name: E2E Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run UI tests
        run: npx playwright test --project=UI
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://parabank.parasoft.com' }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-UI
          path: reports/html/
          retention-days: 14

      - name: Upload shared data (for API tests)
        uses: actions/upload-artifact@v4
        with:
          name: shared-data
          path: shared-data/
          retention-days: 1

      - name: Generate test summary
        if: always()
        run: node .github/workflows/generate-summary.js
        env:
          PROJECT: UI

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-UI
          path: test-summary.json
          retention-days: 1

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ui-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Download shared data from UI tests
        uses: actions/download-artifact@v4
        with:
          name: shared-data
          path: shared-data

      - name: Run API tests
        run: npx playwright test --project=API
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://parabank.parasoft.com' }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-API
          path: reports/html/
          retention-days: 14

      - name: Generate test summary
        if: always()
        run: node .github/workflows/generate-summary.js
        env:
          PROJECT: API

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-API
          path: test-summary.json
          retention-days: 1

  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ui-tests, api-tests]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download test summaries
        uses: actions/download-artifact@v4
        with:
          pattern: test-summary-*
          path: summaries
          merge-multiple: true

      - name: Merge summaries
        run: node .github/workflows/merge-summaries.js

      - name: Generate email report
        id: summary
        run: node .github/workflows/generate-report.js
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Check SMTP secrets
        id: smtp_check
        run: |
          if [ -n "${{ secrets.MAIL_USERNAME }}" ] && [ -n "${{ secrets.MAIL_PASSWORD }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::SMTP not configured. Set MAIL_USERNAME, MAIL_PASSWORD, and MAIL_TO secrets to receive email reports."
          fi

      - name: Send email report
        if: steps.smtp_check.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '587' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: |
            [Parabank Tests] ${{ steps.summary.outputs.status }} — ${{ steps.summary.outputs.total }} tests, ${{ steps.summary.outputs.passed }} passed, ${{ steps.summary.outputs.failed }} failed
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          html_body: file://report-body.html
          ignore_cert: ${{ secrets.MAIL_IGNORE_CERT || 'false' }}
